<!-- Portfolio Modals -->
{% for post in site.posts %}
<div class="portfolio-modal modal fade" id="portfolioModal-{{ post.modal-id }}" tabindex="-1" role="dialog"
  aria-hidden="true">
  <div class="modal-content">
    <div class="close-modal" data-dismiss="modal">
      <div class="lr">
        <div class="rl">
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
          <div class="modal-body">
            <h2>{{ post.title }}</h2>
            <hr class="star-primary">

            <!-- GIF player instead of static image -->
            {% if post.gif %}
            <div class="gif-container">
              <img src="img/portfolio/{{ post.gif }}" class="img-responsive img-centered full-width" alt="{{ post.alt }}">
            </div>
            {% else %}
            <div class="gif-container">
              <img src="img/portfolio/{{ post.img }}" class="img-responsive img-centered" alt="{{ post.alt }}">
            </div>
            {% endif %}

            <!-- Project description -->
            <div class="project-description">
              <h4>About this project:</h4>
              {{ post.content }}
            </div>

            <ul class="list-inline item-details">
              <!-- Project date -->
              {% if post.project-date %}
              <li>Date:
                <strong>{{ post.project-date }}</strong>
              </li>
              {% endif %}

              <!-- GitHub repository link -->
              {% if post.github-link %}
              <li>GitHub:
                <strong><a href="{{ post.github-link }}" target="_blank">View Repository</a></strong>
              </li>
              {% endif %}
            </ul>
            <button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-times"></i>
              Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
